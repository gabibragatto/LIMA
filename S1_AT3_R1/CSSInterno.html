<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CSS_Interno</title>
    <!--- Declaração do CSS interno --->
    <style>
        H1 {
            color: darkred;
            text-align: center;
            font-style: italic;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        h2 {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 20px;
            text-align: center;
        }

        P {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 20px;
            text-align: center;
        }
        .fonte {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>Maria Gabriela Blanc Bragatto</h1>
    <p>Estudante de Desenvolvimento de Sistemas</p>
    <p>Lista de Cursos</p>
    <h2 class="fonte">Lista de Cursos Transversais</h2>
</body>

</html>
